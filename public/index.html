<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Checker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            fadeIn: 'fadeIn 0.5s ease-out'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0 },
              '100%': { opacity: 1 }
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-r from-blue-100 to-purple-100 text-gray-800 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md animate-fadeIn">
    <h1 class="text-3xl font-extrabold mb-6 text-center text-blue-600">🔐 Password Checker</h1>

    <div class="relative mb-4">
      <input id="passwordInput" type="password" placeholder="Enter password"
        class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" />
      <button type="button" onclick="togglePassword()"
        class="absolute inset-y-0 right-2 flex items-center text-gray-500 hover:text-blue-600">
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.065 7-9.542 7S3.732 16.057 2.458 12z" />
        </svg>
      </button>
    </div>

    <button onclick="checkPassword()"
      class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition font-semibold">
      Check Password
    </button>

    <div id="result" class="mt-6 text-sm space-y-2 animate-fadeIn"></div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      icon.innerHTML = isPassword
        ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                 d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.993 9.993 0 013.142-4.568M9.88 9.88a3 3 0 104.24 4.24M3 3l18 18" />`
        : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                 d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                 d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.065 7-9.542 7S3.732 16.057 2.458 12z" />`;
    }

    async function checkPassword() {
      const password = document.getElementById('passwordInput').value;
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `<p class="text-gray-500">Checking...</p>`;

      try {
        const res = await fetch('/check-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (!res.ok) {
          resultDiv.innerHTML = `<p class="text-red-500">${data.error}</p>`;
          return;
        }

        resultDiv.innerHTML = `
          <p><strong class="text-blue-600">Strength:</strong> <span class="font-medium">${data.strength}</span></p>
          <p><strong class="text-blue-600">Suggestions:</strong></p>
          <ul class="list-disc ml-6 text-gray-700">${data.suggestions.map(s => `<li>${s}</li>`).join('')}</ul>
        `;
      } catch (err) {
        resultDiv.innerHTML = `<p class="text-red-500">Error: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
